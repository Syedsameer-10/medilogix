services:
  - type: web
    name: medilogix-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MEDILOGIX_API_HOST
        value: 0.0.0.0
      - key: MEDILOGIX_ALLOWED_ORIGINS
        value: "https://medilogix.vercel.app"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: MEDILOGIX_JWT_SECRET
        generateValue: true
      - key: MEDILOGIX_DEFAULT_DOCTOR_EMAIL
        sync: false
      - key: MEDILOGIX_DEFAULT_DOCTOR_PASSWORD
        sync: false
      - key: MEDILOGIX_DEFAULT_DOCTOR_NAME
        sync: false
